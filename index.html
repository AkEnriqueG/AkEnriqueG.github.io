<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portafolio Hacker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="content">
    <h1>Luis</h1>
    <p class="subtitulo">Programador Hacker</p>

    <section class="galeria">
      <div class="grid">
        <!-- Proyecto -->
        <div class="item">
          <div class="preview"></div>
          <div class="info">
            <h3>Proyecto 1</h3>
            <p>Descripción del proyecto.</p>
            <div class="tags">
              <span>#IA</span>
              <span>#Terminal</span>
              <span>#Linux</span>
            </div>
            <div class="acciones">
              <button>Botón 1</button>
              <button>Botón 2</button>
            </div>
          </div>
        </div>
        <div class="item">
          <div class="preview"></div>
          <div class="info">
            <h3>Proyecto 2</h3>
            <p>Exploración interdimensional mediante código.</p>
            <div class="tags">
              <span>#A1</span>
              <span>#API</span>
              <span>#Web</span>
            </div>
            <div class="acciones">
              <button>Ver</button>
              <button>GitHub</button>
            </div>
          </div>
        </div>
        <!-- Agrega 7 más si lo deseas -->
      </div>
    </section>
  </main>
</body>
</html>
