<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portafolio</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Biblioteca particles.js -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>
  <!-- Contenedor de partículas -->
  <div id="particles-js"></div>

  <main class="content">
    <h1>Luis</h1>
    <p class="subtitulo">Programador</p>

    <section class="galeria">
      <!-- Galería 3x3 -->
      <div class="grid">
        <div class="item">Proyecto 1</div>
        <div class="item">Proyecto 2</div>
        <div class="item">Proyecto 3</div>
        <div class="item">Proyecto 4</div>
        <div class="item">Proyecto 5</div>
        <div class="item">Proyecto 6</div>
        <div class="item">Proyecto 7</div>
        <div class="item">Proyecto 8</div>
        <div class="item">Proyecto 9</div>
      </div>
    </section>
  </main>

  <!-- Configuración e inicialización de partículas -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      particlesJS("particles-js", {
        particles: {
          number: { 
            value: 80,
            density: {
              enable: true,
              value_area: 800
            } 
          },
          color: { value: "#00ffff" },
          shape: { type: "circle" },
          opacity: {
            value: 0.5,
            random: true,
            anim: {
              enable: true,
              speed: 1,
              opacity_min: 0.1,
              sync: false
            }
          },
          size: {
            value: 3,
            random: true,
            anim: {
              enable: true,
              speed: 2,
              size_min: 0.1,
              sync: false
            }
          },
          line_linked: {
            enable: true,
            distance: 150,
            color: "#00ffff",
            opacity: 0.4,
            width: 1
          },
          move: {
            enable: true,
            speed: 1,
            direction: "none",
            random: true,
            straight: false,
            out_mode: "bounce",
            bounce: false,
            attract: {
              enable: true,
              rotateX: 600,
              rotateY: 1200
            }
          }
        },
        interactivity: {
          detect_on: "canvas",
          events: {
            onhover: {
              enable: true,
              mode: "grab"
            },
            onclick: {
              enable: true,
              mode: "push"
            },
            resize: true
          },
          modes: {
            grab: {
              distance: 140,
              line_linked: {
                opacity: 1
              }
            },
            push: {
              particles_nb: 4
            }
          }
        },
        retina_detect: true
      });
    });
  </script>
</body>
</html>
